<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pokémon Card Shop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <h1> Pokémon Card Shop</h1>
    <p>Encontre suas cartas favoritas!</p>
  </header>

  <main>
    <section class="controls">
      <input type="text" id="search" placeholder="Buscar por nome..." />
      <select id="category">
        <option value="">Todas as categorias</option>
      </select>
      <button id="btnRender">🔄 Renderizar</button>
    </section>

    <div id="product-list"></div>

    <div id="product-details">
      <p class="placeholder-texto">Clique em "Ver detalhes" para ver as informações de uma carta.</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
